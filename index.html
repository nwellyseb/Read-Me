<div style="background:#fff; border:1px dashed #ff8fa3; padding:16px; border-radius:16px; text-align:left;">
  <p id="typewriterText" style="font-size:14px; color:#444; line-height:1.5; font-family:monospace; min-height:60px; white-space: pre-wrap;"></p>
  <button onclick="startTypewriter()" style="background:#ff4769; color:#fff; border:none; padding:6px 14px; border-radius:12px; font-weight:bold; cursor:pointer; margin-top:8px;">Read Letter ✍️</button>
</div>

<!-- Background Audio Element -->
<audio id="bgMusic" src="song.mp3" preload="auto" loop></audio>

<script>
  const letterStr = "Mahal ko, sobrang thank you kasi kahit madaming beses na akong naging unreasonable sa mga away natin, di moko sinukuan. Siguro naisip mo na akong iwanan no? Yet, tayo parin hanggang ngayon mahal. Sobrang thankful ako sayo sobra💕";
  let twIdx = 0;
  let twInterval = null;

  function startTypewriter() {
    const music = document.getElementById('bgMusic');
    
    // Reset position and set volume
    music.currentTime = 0;
    music.volume = 0.8;

    // Play with error handling popup
    music.play().catch(error => {
      console.error("Audio playback error:", error);
      alert("Audio failed to play. Please verify that 'song.mp3' is placed in the exact same GitHub folder as your index.html file.");
    });

    // Reset typewriter text
    twIdx = 0;
    const targetEl = document.getElementById('typewriterText');
    targetEl.textContent = "";
    if (twInterval) clearInterval(twInterval);

    twInterval = setInterval(() => {
      twIdx++;
      targetEl.textContent = letterStr.slice(0, twIdx);
      if (twIdx >= letterStr.length) clearInterval(twInterval);
    }, 50);
  }
</script>
