<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter for You 💕</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffe6ea 0%, #ffc2d1 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    .letter-card {
      background: #fff;
      border: 1px dashed #ff8fa3;
      padding: 24px;
      border-radius: 16px;
      text-align: left;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(255, 143, 163, 0.2);
    }

    .read-btn {
      background: #ff4769;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: transform 0.2s ease;
    }

    .read-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="letter-card">
    <p id="typewriterText" style="font-size:14px; color:#444; line-height:1.6; font-family:monospace; min-height:60px; white-space: pre-wrap; margin:0;"></p>
    <button class="read-btn" onclick="startTypewriter()">Read Letter ✍️</button>
  </div>

  <!-- Direct Web Audio Link for Sailor Song -->
  <audio id="bgMusic" src="https://files.catbox.moe/55hhze.mp3" preload="auto" loop></audio>

  <script>
    const letterStr = "Mahal ko, sobrang thank you kasi kahit madaming beses na akong naging unreasonable sa mga away natin, di moko sinukuan. Siguro naisip mo na akong iwanan no? Yet, tayo parin hanggang ngayon mahal. Sobrang thankful ako sayo sobra💕";
    let twIdx = 0;
    let twInterval = null;

    function startTypewriter() {
      const music = document.getElementById('bgMusic');
      music.volume = 1.0;

      // Force play on user button click
      const playPromise = music.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("Audio playback error:", error);
        });
      }

      // Typewriter animation
      twIdx = 0;
      const targetEl = document.getElementById('typewriterText');
      targetEl.textContent = "";
      if (twInterval) clearInterval(twInterval);

      twInterval = setInterval(() => {
        twIdx++;
        targetEl.textContent = letterStr.slice(0, twIdx);
        if (twIdx >= letterStr.length) clearInterval(twInterval);
      }, 50);
    }
  </script>

</body>
</html>
